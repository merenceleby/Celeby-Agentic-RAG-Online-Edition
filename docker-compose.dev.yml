# Geliştirme modu: kodu değiştirince otomatik yenilenir, --build gerekmez.
#   docker compose -f docker-compose.dev.yml up
# Arayüz: http://localhost:5173 (Vite)   API: http://localhost:8000/docs
# Normal moddaki (docker-compose.yml) verilerle aynı volume'ları kullanır; ikisini aynı anda çalıştırma.
services:
  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - chroma_db:/app/chroma_db
      - state:/app/state
      - hf_cache:/models

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules

volumes:
  chroma_db:
  state:
  hf_cache:
  node_modules:
